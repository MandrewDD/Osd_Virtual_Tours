<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Виртуальные туры</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 2rem;
    }

    /* GRID 4 колонки */
    #tour-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Карточка 16:9 */
    .tour-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(145deg, #1e1e1e, #151515);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      text-decoration: none;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .tour-card:hover {
      transform: translateY(-4px);
      background: linear-gradient(145deg, #252525, #1a1a1a);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .tour-card:active {
      transform: translateY(-1px);
    }

    /* Адаптив */
    @media (max-width: 1200px) {
      #tour-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 800px) {
      #tour-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      #tour-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <h1>🗺️ Виртуальные туры</h1>

  <div id="tour-grid"></div>

  <script>
    const owner = "MandrewDD";
    const repo = "Osd_Virtual_Tours";

    const grid = document.getElementById("tour-grid");

    async function loadTours() {
      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/Tours`;
        const res = await fetch(url);
        const data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error("GitHub API error");
        }

        const folders = data.filter(item => item.type === "dir");

        if (folders.length === 0) {
          grid.innerHTML = "<div>Нет доступных туров</div>";
          return;
        }

        folders.forEach(folder => {
          const a = document.createElement("a");

          a.className = "tour-card";
          a.href = `Tours/${folder.name}/output/index.html`;
          a.textContent = folder.name.replace(/_/g, " ");

          grid.appendChild(a);
        });

      } catch (e) {
        console.error(e);
        grid.innerHTML = "<div>Ошибка загрузки данных</div>";
      }
    }

    loadTours();
  </script>
</body>
</html>
